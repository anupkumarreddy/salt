[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-linter"
version = "0.1.0"
description = "SystemVerilog Analysis & Linting Tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Anup Reddy" },
]
keywords = ["systemverilog", "uvm", "lint", "linter", "rtl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
salt = "salt.cli:main"

[project.urls]
Homepage = "https://github.com/anupreddy/salt"
Issues = "https://github.com/anupreddy/salt/issues"
Source = "https://github.com/anupreddy/salt"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["salt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
